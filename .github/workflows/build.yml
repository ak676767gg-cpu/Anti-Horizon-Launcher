# Builds the Anti Horizon Launcher for macOS and Linux on GitHub's own computers, straight from the code in this
# repository, and publishes it as a GitHub release when a version tag (v1.2.3) is pushed. Every download gets a
# SHA-256 fingerprint and a signed record saying it was built here, from this exact commit:
#
#   gh attestation verify Anti-Horizon-Launcher-mac.dmg --repo ak676767gg-cpu/Anti-Horizon-Launcher
#
# The Windows version is built and signed by the developer and is on anti-horizon.com. The update signatures that
# installed launchers check are added on the developer's computer too, so the signing key never leaves it.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: macOS (Apple silicon and Intel)
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Rust for both kinds of Mac
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        working-directory: launcher
        env:
          AH_MSA_CLIENT_ID: ${{ secrets.AH_MSA_CLIENT_ID }}
          AH_CURSEFORGE_KEY: ${{ secrets.AH_CURSEFORGE_KEY }}
        run: |
          if [ -z "$AH_MSA_CLIENT_ID" ]; then echo "::error::The AH_MSA_CLIENT_ID secret is missing, so this build couldn't sign in."; exit 1; fi
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin
      - name: Package
        run: |
          B="launcher/src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir out
          cp "$B"/dmg/*.dmg out/Anti-Horizon-Launcher-mac.dmg
          # What installed launchers update from: the app itself, packed so it unpacks to the .app.
          tar -czf out/Anti-Horizon-Launcher-mac.app.tar.gz -C "$B/macos" "Anti-Horizon Launcher.app"
          ls -la out
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux (AppImage, .deb, .rpm)
    # The oldest supported Ubuntu, so the build runs on as many distributions as possible.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Build
        working-directory: launcher
        env:
          AH_MSA_CLIENT_ID: ${{ secrets.AH_MSA_CLIENT_ID }}
          AH_CURSEFORGE_KEY: ${{ secrets.AH_CURSEFORGE_KEY }}
        run: |
          if [ -z "$AH_MSA_CLIENT_ID" ]; then echo "::error::The AH_MSA_CLIENT_ID secret is missing, so this build couldn't sign in."; exit 1; fi
          npx --yes @tauri-apps/cli@2 build
      - name: Package
        run: |
          B="launcher/src-tauri/target/release/bundle"
          mkdir out
          cp "$B"/appimage/*.AppImage out/Anti-Horizon-Launcher-linux-x86_64.AppImage
          cp "$B"/deb/*.deb out/Anti-Horizon-Launcher-linux-amd64.deb
          cp "$B"/rpm/*.rpm out/Anti-Horizon-Launcher-linux-x86_64.rpm
          ls -la out
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    needs: [mac, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Fingerprints
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Anti Horizon Launcher $V for macOS and Linux, built by GitHub from this commit.

          - **Mac** (Apple silicon and Intel): \`Anti-Horizon-Launcher-mac.dmg\`. The first time, macOS asks you to allow it: open System Settings, Privacy & Security, and choose Open Anyway.
          - **Linux**: the \`.AppImage\` runs on any distribution; \`.deb\` is for Ubuntu, Debian and Mint, \`.rpm\` for Fedora and openSUSE.
          - **Windows**: download it at https://anti-horizon.com.

          Check a download: compare it with \`SHA256SUMS.txt\`, or run \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Anti Horizon Launcher $V" --notes-file notes.md
